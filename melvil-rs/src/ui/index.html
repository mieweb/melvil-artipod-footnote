<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Melvil — Document Search</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f1117; color: #e1e4e8; min-height: 100vh; }
.container { max-width: 800px; margin: 0 auto; padding: 2rem 1rem; }
h1 { font-size: 1.8rem; margin-bottom: 0.5rem; color: #58a6ff; }
.subtitle { color: #8b949e; margin-bottom: 2rem; }
.search-box { display: flex; gap: 0.5rem; margin-bottom: 2rem; }
input[type="text"] { flex: 1; padding: 0.75rem 1rem; border: 1px solid #30363d; border-radius: 6px; background: #161b22; color: #e1e4e8; font-size: 1rem; }
input[type="text"]:focus { outline: none; border-color: #58a6ff; }
button { padding: 0.75rem 1.5rem; border: none; border-radius: 6px; background: #238636; color: #fff; font-size: 1rem; cursor: pointer; }
button:hover { background: #2ea043; }
.results { display: flex; flex-direction: column; gap: 1rem; }
.result-card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 1rem 1.25rem; }
.result-title { font-weight: 600; color: #58a6ff; margin-bottom: 0.25rem; }
.result-url { font-size: 0.8rem; color: #8b949e; margin-bottom: 0.5rem; }
.result-excerpt { font-size: 0.9rem; line-height: 1.5; color: #c9d1d9; white-space: pre-wrap; }
.result-score { font-size: 0.75rem; color: #6e7681; margin-top: 0.5rem; }
.status { color: #8b949e; font-style: italic; margin-bottom: 1rem; }
.health { font-size: 0.8rem; color: #6e7681; margin-top: 2rem; }
</style>
</head>
<body>
<div class="container">
  <h1>📚 Melvil</h1>
  <p class="subtitle">Hybrid document search — vector + full-text with RRF</p>
  <div class="search-box">
    <input type="text" id="query" placeholder="Ask a question..." autofocus>
    <button onclick="search()">Search</button>
  </div>
  <div id="status" class="status"></div>
  <div id="results" class="results"></div>
  <div id="health" class="health"></div>
</div>
<script>
const q = document.getElementById('query');
const resultsDiv = document.getElementById('results');
const statusDiv = document.getElementById('status');
const healthDiv = document.getElementById('health');

q.addEventListener('keydown', e => { if (e.key === 'Enter') search(); });

async function search() {
  const query = q.value.trim();
  if (!query) return;
  statusDiv.textContent = 'Searching...';
  resultsDiv.innerHTML = '';
  try {
    const res = await fetch('/api/search', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({question: query, k: 10})
    });
    const data = await res.json();
    if (data.error) { statusDiv.textContent = 'Error: ' + data.error; return; }
    statusDiv.textContent = data.results.length + ' results';
    resultsDiv.innerHTML = data.results.map((r, i) => `
      <div class="result-card">
        <div class="result-title">[${i+1}] ${esc(r.title)}</div>
        <div class="result-url">${esc(r.url)}</div>
        <div class="result-excerpt">${esc(r.excerpt)}</div>
        <div class="result-score">Score: ${r.score.toFixed(4)}</div>
      </div>
    `).join('');
  } catch(e) { statusDiv.textContent = 'Error: ' + e.message; }
}

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

fetch('/api/health').then(r=>r.json()).then(d=>{
  healthDiv.textContent = `Model: ${d.model} | Chunks: ${d.chunks}`;
}).catch(()=>{});
</script>
</body>
</html>
