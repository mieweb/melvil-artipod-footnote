[package]
name = "melvil-rs"
version = "0.1.0"
edition = "2021"
description = "High-performance document indexer and RAG engine — Rust rewrite of docidx/FOOTNOTE"
license = "MIT"
readme = "README.md"

[[bin]]
name = "melvil"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Parsing
pulldown-cmark = "0.12"
liteparse = "2"

# Chunking / tokenization
tokenizers = "0.21"

# Embeddings (in-process ONNX)
fastembed = "4"

# Storage
rusqlite = { version = "0.32", features = ["bundled", "vtab"] }
sqlite-vec = "0.1"

# HTTP server (web UI + MCP fallback)
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "fs"] }

# HTTP clients (for Ollama/OpenAI fallback)
reqwest = { version = "0.12", features = ["json", "stream", "blocking"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Compression
tar = "0.4"
zstd = "0.13"

# Hashing
sha2 = "0.10"
hex = "0.4"

# Parallelism
rayon = "1.10"

# File system
walkdir = "2"
glob = "0.3"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Local LLM inference (optional — GGUF models via llama.cpp)
llama-cpp-2 = { version = "0.1", optional = true }
hf-hub = { version = "0.4", optional = true, features = ["tokio"] }

# Utilities
anyhow = "1"
thiserror = "2"
chrono = "0.4"
indicatif = "0.17"
futures = "0.3"
regex = "1"

[features]
default = []
llm = ["llama-cpp-2", "hf-hub"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
